<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="DetectHugeFile — scopri dove se ne va lo spazio sul tuo Mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A5C"/>
      <stop offset="1" stop-color="#4B2A8C"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3373F2"/>
      <stop offset="1" stop-color="#8C40D9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8C33"/>
      <stop offset="1" stop-color="#FFC15E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <!-- treemap decorativa -->
  <g opacity=".10" fill="#fff">
    <rect x="840" y="30" width="170" height="130" rx="10"/>
    <rect x="1020" y="30" width="150" height="80" rx="10"/>
    <rect x="1020" y="120" width="150" height="90" rx="10"/>
    <rect x="840" y="170" width="100" height="120" rx="10"/>
    <rect x="950" y="220" width="220" height="70" rx="10"/>
  </g>
  <rect x="1020" y="30" width="150" height="80" rx="10" fill="#FF8C33" opacity=".35"/>
  <!-- logo -->
  <g transform="translate(60 56) scale(.82)">
    <rect x="15" y="15" width="226" height="226" rx="51" fill="url(#icon)"/>
    <circle cx="128" cy="128" r="70" fill="#fff" fill-opacity=".35"/>
    <path d="M128 128 L128 58 A70 70 0 1 1 67.4 163 Z" fill="#fff"/>
    <path d="M135.7 120.3 L204.6 108.1 A70 70 0 0 0 141.8 50.6 Z" fill="#FF8C33"/>
  </g>
  <text x="300" y="150" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#fff" letter-spacing="-1.5">Detect<tspan fill="url(#accent)">Huge</tspan>File</text>
  <text x="302" y="205" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#D8DDF5">Scopri dove se ne va lo spazio sul tuo Mac.</text>
  <text x="302" y="245" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#A9B2E0">Veloce · Sicuro · Tutto nel Cestino, tutto ripristinabile</text>
</svg>
